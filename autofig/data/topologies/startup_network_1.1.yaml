schema_version: 1.0
topology_name: Enterprise Lab
description: >
  Example enterprise topology with one router, one multilayer core switch, and two access switches.
  The router provides WAN connectivity, the multilayer switch handles inter-VLAN routing,
  and access switches serve edge devices.

defaults:
  domain: corp.local
  dns_servers:
    - 1.1.1.1
    - 8.8.8.8
  ntp_servers:
    - pool.ntp.org
  banner: |
    Unauthorized access prohibited. Corporate Lab Environment.

devices:
  # === Router ===
  - name: R1
    hostname: EdgeRouter
    type: router
    vendor: cisco

    interfaces:
      - name: Gig0/0
        ip: 203.0.113.2
        mask: 255.255.255.252
        description: WAN Uplink
      - name: Gig0/1
        ip: 10.0.0.1
        mask: 255.255.255.252
        description: Link to Core Switch

    static_routes:
      - { destination: 0.0.0.0/0, next_hop: 203.0.113.1 }

    ospf:
      process_id: 1
      router_id: 10.0.0.1
      networks:
        - { network: 10.0.0.0, wildcard: 0.0.0.3, area: 0 }

    services:
      ntp_servers: [pool.ntp.org]
      domain: corp.local
      ssh_rsa_bits: 2048

    security:
      banner: |
        Authorized Access Only!
        Edge Router – Corp Network


  # === Multilayer Switch (Core) ===
  - name: MLS1
    hostname: CoreSwitch
    type: multilayer_switch
    vendor: cisco

    vlans:
      - { id: 10, name: STAFF }
      - { id: 20, name: GUEST }
      - { id: 30, name: MGMT }

    interfaces:
      - name: Gig0/1
        mode: trunk
        description: Uplink to Edge Router
      - name: Gig0/2
        mode: trunk
        description: Uplink to AccessSwitch1
      - name: Gig0/3
        mode: trunk
        description: Uplink to AccessSwitch2

    svis:
      - vlan: 10
        ip: 192.168.10.1
        mask: 255.255.255.0
      - vlan: 20
        ip: 192.168.20.1
        mask: 255.255.255.0
      - vlan: 30
        ip: 192.168.30.1
        mask: 255.255.255.0

    static_routes:
      - { destination: 0.0.0.0/0, next_hop: 10.0.0.1 }

    ospf:
      process_id: 1
      router_id: 192.168.10.1
      networks:
        - { network: 10.0.0.0, wildcard: 0.0.0.3, area: 0 }
        - { network: 192.168.10.0, wildcard: 0.0.0.255, area: 0 }
        - { network: 192.168.20.0, wildcard: 0.0.0.255, area: 0 }

    services:
      ntp_servers: [pool.ntp.org]
      domain: corp.local
      ssh_rsa_bits: 2048

    security:
      banner: |
        Authorized Access Only!
        Core Switch – Corp Network


  # === Access Switch 1 ===
  - name: SW1
    hostname: AccessSwitch1
    type: switch
    vendor: cisco

    vlans:
      - { id: 10, name: STAFF }
      - { id: 20, name: GUEST }

    interfaces:
      - name: Gig0/1
        mode: access
        vlan: 10
        description: Staff Workstation
        port_security:
          enabled: true
          max_mac: 2
          violation: restrict
      - name: Gig0/24
        mode: trunk
        description: Uplink to Core Switch

    stp:
      mode: rapid-pvst

    snmp:
      community: public
      location: "Access Layer – Floor 1"

    security:
      banner: |
        Access Switch 1 – Corporate Network


  # === Access Switch 2 ===
  - name: SW2
    hostname: AccessSwitch2
    type: switch
    vendor: cisco

    vlans:
      - { id: 20, name: GUEST }
      - { id: 30, name: MGMT }

    interfaces:
      - name: Gig0/1
        mode: access
        vlan: 20
        description: Guest Wi-Fi
      - name: Gig0/2
        mode: access
        vlan: 30
        description: Management Console
      - name: Gig0/24
        mode: trunk
        description: Uplink to Core Switch

    stp:
      mode: rapid-pvst

    snmp:
      community: public
      location: "Access Layer – Floor 2"

    security:
      banner: |
        Access Switch 2 – Corporate Network
