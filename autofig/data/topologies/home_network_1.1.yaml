schema_version: 1.0
topology_name: Home Network

defaults:
  domain: home.local
  dns_servers:
    - 1.1.1.1
    - 8.8.8.8
  ntp_servers:
    - pool.ntp.org
  banner: |
    Unauthorized access prohibited.

devices:

  - name: R1
    hostname: HomeRouter
    type: router
    vendor: cisco
    interfaces:
      - name: Gig0/0
        ip: 192.168.1.1
        mask: 255.255.255.0
        description: LAN Interface
      - name: Gig0/1
        ip: 203.0.113.2
        mask: 255.255.255.252
        description: WAN Uplink
      - name: Loopback0
        ip: 10.255.255.1
        mask: 255.255.255.255
    ospf:
      process_id: 1
      networks:
        - { network: 192.168.1.0, wildcard: 0.0.0.255, area: 0 }
        - { network: 10.255.255.1, wildcard: 0.0.0.0, area: 0 }
    dhcp:
      pools:
        - name: HOME_POOL
          network: 192.168.1.0
          mask: 255.255.255.0
          default_router: 192.168.1.1
          dns: [8.8.8.8]
    nat:
      inside_interface: Gig0/0
      outside_interface: Gig0/1
      overload: true
    acls:
      - name: ALLOW_LAN
        type: standard
        rules:
          - { action: permit, src: 192.168.1.0, wildcard: 0.0.0.255 }

  - name: SW1
    hostname: HomeSwitch
    type: switch
    vendor: cisco
    vlans:
      - id: 10
        name: STAFF
      - id: 20
        name: GUEST
    interfaces:
      - name: Gig0/1
        mode: access
        vlan: 10
        port_security:
          enabled: true
          max_mac: 2
          violation: restrict
      - name: Gig0/24
        mode: trunk
        description: Uplink to Router
    stp:
      mode: rapid-pvst
    snmp:
      community: public
      location: "Home Lab"

